<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutas Permanentes</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#08090c;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
header{
  padding:28px 18px;
  text-align:center;
  background:linear-gradient(180deg,#12151b,#08090c);
  border-bottom:1px solid #292d35;
}
header h1{margin:0;font-size:28px;color:#fff}
header p{margin:8px 0 0;color:#aeb4c0}
.container{
  max-width:1120px;
  margin:0 auto;
  padding:18px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
.card{
  background:#111318;
  border:1px solid #292d35;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 0 18px rgba(255,0,0,.08);
}
.card img{
  width:100%;
  height:300px;
  object-fit:cover;
  display:block;
}
.info{padding:16px}
.info h2{
  margin:0 0 12px;
  font-size:18px;
  text-transform:uppercase;
  letter-spacing:.3px;
}
.rating{color:#ffd34d;font-size:14px;font-weight:bold}
.rating span{color:#a7a7a7;font-weight:normal;margin-left:5px}
.price{
  margin:14px 0;
  color:#ff4b52;
  font-size:28px;
  font-weight:800;
}
.stock{color:#c4c7ce;font-size:14px;margin-bottom:16px}
.stock b{color:#fff}
button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(90deg,#e81720,#ff3440);
}
button:hover{filter:brightness(1.08)}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .card img{height:auto;aspect-ratio:16/9}
  header h1{font-size:23px}
}
</style>
</head>
<body>
<header>
  <h1>🔥 FRUTAS PERMANENTES</h1>
  <p>Escolha sua fruta permanente</p>
</header>

<main class="container">
  <section class="grid" id="grid"></section>
</main>

<script>
const frutas = [
{name:"Dragon", image:"assets/dragon.jpg", price:"165,00"},
{name:"Kitsune", image:"assets/kitsune.jpg", price:"132,00"},
{name:"Control", image:"assets/control.jpg", price:"—"},
{name:"Magnete", image:"assets/magnete.jpg", price:"—"},
{name:"Yeti", image:"assets/yeti.jpg", price:"100,00"},
{name:"Tiger", image:"assets/tiger.jpg", price:"100,00"},
{name:"Shadow", image:"assets/shadow.jpg", price:"—"},
{name:"Gass", image:"assets/gass.jpg", price:"—"},
{name:"Venom", image:"assets/venom.jpg", price:"80,00"},
{name:"Dough", image:"assets/dough.jpg", price:"79,00"},
{name:"Mamuth", image:"assets/mamuth.jpg", price:"—"},
{name:"T Rex", image:"assets/t-rex.jpg", price:"—"},
{name:"Gravity", image:"assets/gravity.jpg", price:"75,00"},
{name:"Blizzard", image:"assets/blizzard.jpg", price:"75,00"},
{name:"Pain", image:"assets/pain.jpg", price:"—"},
{name:"Lightning", image:"assets/lightning.jpg", price:"—"},
{name:"Portal", image:"assets/portal.jpg", price:"66,00"},
{name:"Sound", image:"assets/sound.jpg", price:"62,00"},
{name:"Buddha", image:"assets/buddha.jpg", price:"—"},
{name:"Quake", image:"assets/quake.jpg", price:"—"},
{name:"Magma", image:"assets/magma.jpg", price:"46,00"},
{name:"Light", image:"assets/light.jpg", price:"38,00"},
{name:"Ice", image:"assets/ice.jpg", price:"—"}
];

const grid = document.getElementById("grid");

frutas.forEach(fruta => {
  const preco = fruta.price === "—" ? "R$ —" : "R$ " + fruta.price;
  grid.innerHTML += `
    <article class="card">
      <img src="${fruta.image}" alt="${fruta.name} Permanente">
      <div class="info">
        <h2>${fruta.name.toUpperCase()} PERMANENTE</h2>
        <div class="rating">★★★★★ <span>4,9 (avaliações)</span></div>
        <div class="price">${preco}</div>
        <div class="stock">📦 Estoque: <b>4000</b></div>
        <button onclick="comprar('${fruta.name}')">🛒 Comprar agora</button>
      </div>
    </article>
  `;
});

function comprar(nome) {
  alert("Você selecionou: " + nome + " Permanente");
}
</script>
</body>
</html>
