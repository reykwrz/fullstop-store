<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FullStop STORE</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #080808;
    color: white;
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 18px 8%;

    background: #0d0d0d;
    border-bottom: 2px solid #7b2cff;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.logo span {
    color: #9d5cff;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: #9d5cff;
}

.cart-button {
    background: #7b2cff;
    color: white;

    border: none;
    border-radius: 8px;

    padding: 11px 18px;

    cursor: pointer;
    font-weight: bold;
}

/* HERO */

.hero {
    min-height: 450px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    background:
    radial-gradient(circle, #421080, #080808 70%);

    padding: 30px;
}

.hero h1 {
    font-size: 55px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #9d5cff;
}

.hero p {
    color: #ccc;
    margin-bottom: 25px;
    font-size: 18px;
}

.hero button {
    padding: 14px 28px;

    border: none;
    border-radius: 8px;

    background: #7b2cff;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

/* PRODUTOS */

.products-section {
    padding: 60px 8%;
}

.category-title {
    text-align: center;
    font-size: 32px;

    margin-top: 40px;
    margin-bottom: 10px;
}

.mythical-title {
    color: #b45cff;
}

.legendary-title {
    color: #ffd54a;
}

.subtitle {
    text-align: center;
    color: #aaa;

    margin-bottom: 35px;
}

.products {
    display: grid;

    grid-template-columns:
    repeat(auto-fit, minmax(210px, 1fr));

    gap: 22px;
}

/* CARD */

.product {
    background: #111;

    border: 1px solid #292929;
    border-radius: 15px;

    padding: 20px;

    text-align: center;

    transition: 0.3s;
}

.product:hover {
    transform: translateY(-7px);

    border-color: #7b2cff;

    box-shadow:
    0 0 20px rgba(123,44,255,.4);
}

/* IMAGEM */

.product-icon {
    height: 140px;

    display: flex;

    justify-content: center;
    align-items: center;
}

.product-icon img {
    width: 120px;
    height: 120px;

    object-fit: contain;
}

.product h3 {
    font-size: 22px;
    margin: 10px 0;
}

.price {
    color: #b45cff;

    font-size: 19px;
    font-weight: bold;

    margin-bottom: 15px;
}

.product button {
    width: 100%;

    padding: 12px;

    border: none;
    border-radius: 8px;

    background: #7b2cff;
    color: white;

    font-weight: bold;
    cursor: pointer;
}

.product button:hover {
    background: #9d5cff;
}

/* CARRINHO */

.cart {
    position: fixed;

    top: 0;
    right: -400px;

    width: 370px;
    height: 100vh;

    background: #101010;

    border-left: 2px solid #7b2cff;

    padding: 25px;

    z-index: 2000;

    transition: .4s;

    overflow-y: auto;
}

.cart.active {
    right: 0;
}

.close-cart {
    position: absolute;

    top: 10px;
    right: 20px;

    background: none;
    border: none;

    color: white;
    font-size: 30px;

    cursor: pointer;
}

.cart h2 {
    margin-bottom: 25px;
}

.cart-item {
    background: #191919;

    padding: 15px;
    margin-bottom: 12px;

    border-radius: 10px;
}

.cart-info {
    display: flex;
    justify-content: space-between;
}

.quantity-controls {
    display: flex;
    gap: 12px;

    margin-top: 12px;

    align-items: center;
}

.quantity-controls button {
    width: 30px;
    height: 30px;

    background: #7b2cff;

    border: none;
    border-radius: 5px;

    color: white;
    cursor: pointer;
}

.total {
    font-size: 22px;
    font-weight: bold;

    margin-top: 25px;
}

.discord-button {
    width: 100%;

    margin-top: 20px;
    padding: 15px;

    background: #7b2cff;

    border: none;
    border-radius: 8px;

    color: white;
    font-weight: bold;

    cursor: pointer;
}

/* FOOTER */

footer {
    margin-top: 40px;

    padding: 25px;

    background: #050505;

    text-align: center;
    color: #777;
}

/* CELULAR */

@media(max-width:700px) {

    nav {
        display: none;
    }

    .hero h1 {
        font-size: 38px;
    }

    .cart {
        width: 100%;
        right: -100%;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">
FullStop <span>STORE</span>
</div>

<nav>
<a href="#inicio">Início</a>
<a href="#miticas">Míticas</a>
<a href="#lendarias">Lendárias</a>
</nav>

<button class="cart-button" onclick="openCart()">
🛒 <span id="cart-count">0</span>
</button>

</header>


<section class="hero" id="inicio">

<h1>
FULLSTOP <span>STORE</span>
</h1>

<p>🟣 Sua loja de Blox Fruits 🟣</p>

<button onclick="document.getElementById('miticas').scrollIntoView()">
VER FRUTAS
</button>

</section>


<section class="products-section">

<!-- MÍTICAS -->

<h2 id="miticas" class="category-title mythical-title">
🟣 FRUTAS MÍTICAS
</h2>

<p class="subtitle">
Frutas Míticas disponíveis
</p>

<div class="products">

<script>

const mythicals = [
["Gravity","gravity.png",0],
["Mammoth","mammoth.png",6],
["T-Rex","trex.png",6],
["Dough","dough.png",8],
["Shadow","shadow.png",0],
["Venom","venom.png",0],
["Gas","gas.png",0],
["Spirit","spirit.png",8],
["Tiger","tiger.png",0],
["Yeti","yeti.png",0],
["Kitsune","kitsune.png",35],
["Control","control.png",20],
["Dragon","dragon.png",75]
];

</script>

</div>


<!-- LENDÁRIAS -->

<h2 id="lendarias" class="category-title legendary-title">
🟡 FRUTAS LENDÁRIAS
</h2>

<p class="subtitle">
Frutas Lendárias disponíveis
</p>

<div class="products" id="legendary-products"></div>

</section>


<!-- CARRINHO -->

<div class="cart" id="cart">

<button class="close-cart" onclick="closeCart()">×</button>

<h2>🛒 Seu Carrinho</h2>

<div id="cart-items"></div>

<div class="total">
💰 Total: R$ <span id="total">0,00</span>
</div>

<button class="discord-button" onclick="finalizarPedido()">
💬 FINALIZAR PEDIDO
</button>

</div>


<footer>
© 2026 FullStop STORE
</footer>


<script>

/* LISTA DE FRUTAS */

const legendaries = [

["Quake","quake.png",0],
["Buddha","buddha.png",5],
["Love","love.png",0],
["Creation","creation.png",0],
["Spider","spider.png",0],
["Sound","sound.png",0],
["Phoenix","phoenix.png",0],
["Portal","portal.png",6],
["Lightning","lightning.png",0],
["Pain","pain.png",0],
["Blizzard","blizzard.png",0]

];


/* MOSTRAR MÍTICAS */

const mythicalContainer =
document.querySelector(".products");


mythicals.forEach(function(fruit){

mythicalContainer.innerHTML += `

<div class="product">

<div class="product-icon">

<img src="imagens/${fruit[1]}"
alt="${fruit[0]}">

</div>

<h3>${fruit[0]}</h3>

<div class="price">

R$ ${fruit[2].toFixed(2).replace(".",",")}

</div>

<button onclick="addToCart('${fruit[0]}',${fruit[2]})">

Adicionar ao carrinho

</button>

</div>

`;

});


/* MOSTRAR LENDÁRIAS */

const legendaryContainer =
document.getElementById("legendary-products");


legendaries.forEach(function(fruit){

legendaryContainer.innerHTML += `

<div class="product">

<div class="product-icon">

<img src="imagens/${fruit[1]}"
alt="${fruit[0]}">

</div>

<h3>${fruit[0]}</h3>

<div class="price">

R$ ${fruit[2].toFixed(2).replace(".",",")}

</div>

<button onclick="addToCart('${fruit[0]}',${fruit[2]})">

Adicionar ao carrinho

</button>

</div>

`;

});


/* CARRINHO */

let cart = [];


function openCart() {

document.getElementById("cart")
.classList.add("active");

}


function closeCart() {

document.getElementById("cart")
.classList.remove("active");

}


function addToCart(name,price) {

let product =
cart.find(item => item.name === name);


if(product){

product.quantity++;

}else{

cart.push({

name:name,
price:price,
quantity:1

});

}


updateCart();

openCart();

}


function increaseQuantity(index){

cart[index].quantity++;

updateCart();

}


function decreaseQuantity(index){

if(cart[index].quantity > 1){

cart[index].quantity--;

}else{

cart.splice(index,1);

}

updateCart();

}


function updateCart(){

let container =
document.getElementById("cart-items");


container.innerHTML="";


let total=0;

let quantityTotal=0;


cart.forEach(function(item,index){

let subtotal =
item.price * item.quantity;


total += subtotal;

quantityTotal += item.quantity;


container.innerHTML += `

<div class="cart-item">

<div class="cart-info">

<div>

<b>${item.name}</b>

<br>

R$ ${item.price
.toFixed(2)
.replace(".",",")}

</div>

<div>

R$ ${subtotal
.toFixed(2)
.replace(".",",")}

</div>

</div>


<div class="quantity-controls">

<button onclick="decreaseQuantity(${index})">
−
</button>

<span>
${item.quantity}
</span>

<button onclick="increaseQuantity(${index})">
+
</button>

</div>

</div>

`;

});


document.getElementById("total")
.innerText =
total.toFixed(2).replace(".",",");


document.getElementById("cart-count")
.innerText =
quantityTotal;

}


/* FINALIZAR */

function finalizarPedido(){

if(cart.length === 0){

alert("Seu carrinho está vazio!");

return;

}


let pedido =
`🟣 PEDIDO - FULLSTOP STORE 🟣

📦 PRODUTOS:

`;


let total=0;


cart.forEach(function(item){

let subtotal =
item.price * item.quantity;


pedido +=

`• ${item.name}
Quantidade: ${item.quantity}
Subtotal: R$ ${subtotal.toFixed(2).replace(".",",")}

`;


total += subtotal;

});


pedido +=

`💰 TOTAL: R$ ${total.toFixed(2).replace(".",",")}

Aguardo atendimento! 🟣`;


/* COPIAR */

navigator.clipboard
.writeText(pedido)
.then(function(){

alert(
"Pedido copiado! O Discord será aberto."
);

window.open(
"https://discord.gg/unYvTKkX4",
"_blank"
);

});

}

</script>

</body>
</html>
